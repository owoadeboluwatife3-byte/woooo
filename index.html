students.push({ name: "Ade", score: 90 })
const studentList = document.getElementById('studentList')
const newStudentName = document.getElementById('newStudentName')
const newStudentScore = document.getElementById('newStudentScore')

const displayList = (array) => {
    studentList.innerHTML = ''

    array.forEach((student, index) => {
        const li = document.createElement('li')

        li.innerText = `${student.name} - ${student.score}`

        li.style.color = student.score >= 50 ? 'green' : 'red'

    
        const deleteBtn = document.createElement('button')
        deleteBtn.innerText = 'Delete'

    
        deleteBtn.addEventListener('click', () => {
            students.splice(index, 1)
            displayList(students)
        })

        li.append(deleteBtn)

        studentList.append(li)

        
    })
    
}

displayList(students)

const passed = students.filter((student)=>student.score >= 50)
console.log(passed)

report.innerText = `${passed.length} students passed out of ${students.length}`

passBtn.addEventListener('click', ()=>{
  displayList(passed)
})

 
  const addNewStudent = (studentName,studentScore) => {
       studentName = newStudentName.value
        studentScore = Number(newStudentScore.value) 
    const newStudent = {
       name : studentName,
       score: studentScore
    }
    
   const allStudents = [...students,newStudent]

    
    displayList(allStudents)

   newStudentName.value = ''
   newStudentScore.value = ''

    report.innerText = `${passed.length} students passed out of ${allStudents.length}`
   
  }



  addStudentBtn.addEventListener('click',()=>{
    addNewStudent()
  })
